spring:
  application:
    name: cinema-management-system
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cinema_management?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_uuid_jdbc_type: BINARY
  jackson:
    time-zone: UTC

logging:
  level:
    org.hibernate.orm.jdbc.bind: "OFF"
    org.hibernate.orm.jdbc.extract: "OFF"

cinema:
  pagination:
    default-size: 20
    max-size: 100
  rate-limit:
    max-tracked-keys: ${RATE_LIMIT_MAX_TRACKED_KEYS:10000}
    entry-ttl: ${RATE_LIMIT_ENTRY_TTL:15m}
    screening-submission:
      capacity: ${RATE_LIMIT_SCREENING_SUBMISSION_CAPACITY:10}
      refill-period: ${RATE_LIMIT_SCREENING_SUBMISSION_WINDOW:1m}
    creation:
      capacity: ${RATE_LIMIT_CREATION_CAPACITY:30}
      refill-period: ${RATE_LIMIT_CREATION_WINDOW:1m}
    program-search:
      capacity: ${RATE_LIMIT_PROGRAM_SEARCH_CAPACITY:120}
      refill-period: ${RATE_LIMIT_PROGRAM_SEARCH_WINDOW:1m}
    screening-search:
      capacity: ${RATE_LIMIT_SCREENING_SEARCH_CAPACITY:120}
      refill-period: ${RATE_LIMIT_SCREENING_SEARCH_WINDOW:1m}
  idempotency:
    retention: ${IDEMPOTENCY_RETENTION:24h}
